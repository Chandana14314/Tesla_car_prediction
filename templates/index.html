<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TeslaY Price Predictor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 1rem;
      animation: fadeInDown 1.5s ease;
    }

    header img {
      max-width: 300px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      animation: zoomIn 1.5s ease;
    }

    h1 {
      margin-top: 1rem;
      font-size: 2rem;
      font-weight: 600;
    }

    .container {
      background: rgba(255,255,255,0.1);
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      text-align: center;
      width: 90%;
      max-width: 500px;
      margin-top: 2rem;
      animation: fadeIn 1.5s ease;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1rem;
    }

    input {
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: transform 0.2s ease;
    }

    input:focus {
      transform: scale(1.05);
    }

    button {
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      background: #ff4b2b;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background: #ff416c;
      transform: scale(1.05);
    }

    .prediction {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: 600;
      animation: fadeInUp 1s ease;
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 1rem;
      background: rgba(0,0,0,0.5);
      font-size: 0.9rem;
      animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeInUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <!-- Tesla car photo -->
    <img src="https://tesla-cdn.thron.com/delivery/public/image/tesla/0c7c7f9d-2e6c-4f9d-9e7a-0a9f7e9e7c7a/bvlatuR/std/2880x1800/_25-Hero-Desktop" alt="Tesla Car">
    <h1>🚗 TeslaY Price Predictor</h1>
  </header>

  <div class="container">
    <form action="/predict" method="post">
      <input type="number" name="year" placeholder="Enter Year (e.g. 2025)" required>
      <input type="number" name="km" placeholder="Enter Kilometers Driven" required>
      <input type="text" name="color" placeholder="Enter Color" required>
      <button type="submit">Predict Price</button>
    </form>

    {% if prediction_text %}
      <div class="prediction">
        🔮 Predicted Price: ₹ {{ prediction_text }}
      </div>
    {% endif %}
  </div>

  <footer>
    <p>Project by <strong>P. Chandana</strong> — Data Science with Gen AI at Vihara Tech</p>
  </footer>
</body>
</html>
